<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRO-spectus Org Architecture: who can see what today, the target model, and how a day changes</title>
<style>
:root{--surface:#f4f4f2;--panel:#fcfcfb;--panel2:#ededea;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a897f;--line:#dedcd6;
 --today:#eb6834;--target:#2a78d6;--s3:#1baf7a;--good:#1f7a1f;--warn:#b86e00;--crit:#c43c3b;
 --seq1:#e3edf9;--seq2:#b9d1f1;--seq3:#7fa9e4;--seq4:#2a78d6;--seq5:#174a8a;--work:#2a78d6;--read:#b9d1f1;--none:#f1f1ee}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--surface);color:var(--ink);font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 22px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{color:var(--ink2);font-size:13px}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel2)}
.switch button{border:0;background:transparent;padding:7px 16px;font:inherit;cursor:pointer;color:var(--ink2)}
.switch button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 2px var(--modecol)}
.ghost{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:16px;cursor:pointer;font-size:13px}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 52px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:14px 0;position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow:auto}
nav a{display:block;padding:8px 20px;color:var(--ink2);text-decoration:none;font-size:14px;border-left:3px solid transparent}
nav a .n{display:inline-block;width:24px;color:var(--ink3)}
nav a.active{border-left-color:var(--modecol);color:var(--ink);background:#f3f6fb;font-weight:600}
nav .t{color:var(--ink3);font-size:12px;padding:6px 20px;margin-top:8px;letter-spacing:.04em}
nav .hint{color:var(--ink3);font-size:11.5px;padding:14px 20px 0;line-height:1.5}
main{padding:26px 36px 80px;max-width:1280px;min-width:0;overflow-x:hidden}
.heat{display:block;overflow-x:auto}
section{display:none}section.active{display:block}
h2{font-size:26px;margin:0 0 6px;font-weight:650}
h3{font-size:16px;margin:14px 0 8px;font-weight:600}
.lead{font-size:17px;color:var(--ink2);margin:0 0 18px;max-width:960px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.tile .v{font-size:32px;font-weight:700;line-height:1.1}
.tile .l{color:var(--ink2);font-size:13px;margin-top:4px}
.tile .d{font-size:12px;margin-top:8px;color:var(--ink3)}
.tile.bad .v{color:var(--crit)}.tile.ok .v{color:var(--good)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.card h3{margin:0 0 10px}
.card.today{border-top:4px solid var(--today)}.card.target{border-top:4px solid var(--target)}
.note{border-left:5px solid var(--target);background:#eef4fd;padding:10px 14px;border-radius:6px;margin:14px 0;font-size:14px}
.note.red{border-color:var(--crit);background:#fdeeee}.note.green{border-color:var(--good);background:#eaf7ea}
.presenter{display:none;border:1px dashed var(--ink3);background:#fffdf3;padding:10px 14px;border-radius:6px;margin-top:16px;font-size:13.5px;color:var(--ink2)}
body.notes .presenter{display:block}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--panel)}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#f4f5f2;font-weight:600;color:var(--ink2);font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;position:sticky;top:0}
tr:hover td{background:#f7f9fc}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}
.pill.crit{background:#fbe3e3;color:#8f1d1d}.pill.major{background:#fde9df;color:#8a3a14}.pill.minor{background:#f1f1ee;color:#4b4a44}.pill.wave{background:#e8eef9;color:#1f4b8f}
.layers{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.layer{display:grid;grid-template-columns:150px 1fr 320px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--panel)}
.layer:hover{background:#f3f6fb}.layer .nm{font-weight:650}.layer .what{color:var(--ink2);font-size:13.5px}.layer .job{font-size:13px;color:var(--ink2)}
.layer.bad{border-left:6px solid var(--crit)}.layer.ok{border-left:6px solid var(--good)}
.bars{margin:10px 0}
.bar{display:grid;grid-template-columns:330px 1fr 60px;align-items:center;gap:10px;height:30px;font-size:13.5px}
.bar .trk{height:16px;background:#f0f0ec;border-radius:4px}
.bar .fil{height:16px;border-radius:0 4px 4px 0;background:var(--target);min-width:2px}
.bar.red .fil{background:var(--crit)}.bar .num{text-align:right;color:var(--ink2)}
.heat td.c{text-align:center;font-weight:600;width:84px}
.c.ok{background:#e3f6e3;color:#0d5c0d}.c.no{background:#fbe3e3;color:#8f1d1d}.c.mid{background:#fff3d6;color:#7a5200}
.persona{display:grid;grid-template-columns:250px 1fr;gap:18px}
.plist button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13.5px}
.plist button.on{border-color:var(--target);background:#eef4fd;font-weight:600}
.plist .t{color:var(--ink3);font-size:11.5px;margin:10px 0 4px;letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0;background:#fff;font-family:Consolas,monospace}
.chip.k-profile{border-color:#9f9d96}.chip.k-psg{background:#e3edf9}.chip.k-prg{background:#dff3ea}.chip.k-grp{background:#fbe9d6}.chip.k-q{background:#f3e9fb}.chip.k-role{background:#fdf3d0}
.chip.bad{border-color:#f2b8b8;background:#fdeeee}.chip.ok{border-color:#b7e3b7;background:#eaf7ea}
.legend{font-size:12px;color:var(--ink2);margin:6px 0 10px}
.legend span{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin:0 4px 0 10px;border:1px solid var(--line)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 10px}
select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
label.cb{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:13px}
ul.can{margin:0;padding-left:18px}ul.can li{margin:3px 0}
.ok{color:var(--good)}.no{color:var(--crit)}.mid{color:var(--warn)}
.result{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--panel2);font-size:14px}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.wave{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);cursor:pointer}
.wave.on{border-color:var(--target);box-shadow:0 0 0 2px #cde2fb}.wave h4{margin:0 0 6px;font-size:15px}.wave .w{color:var(--ink2);font-size:13px}
.filters{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.foot{color:var(--ink3);font-size:12px;margin-top:30px}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px;background:#f4f5f2}
.diagram{font-family:Consolas,monospace;font-size:12.5px;white-space:pre;background:#f4f5f2;border-radius:8px;padding:14px 16px;overflow:auto;line-height:1.35}
.mat-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
td.cell{text-align:center;width:72px;border-left:2px solid var(--panel)}
.steps .step{display:grid;grid-template-columns:28px 1fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps .step:last-child{border-bottom:0}
.step .n{font-weight:600;color:var(--ink3)}
.step .t{border-left:3px solid var(--today);padding-left:10px}.step .g{border-left:3px solid var(--target);padding-left:10px}
.step b.h{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin-bottom:2px}
.pbar{display:grid;grid-template-columns:170px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.pbar .b{height:12px;border-radius:0 4px 4px 0;background:var(--today);min-width:2px}.pbar .b.g{background:var(--target);margin-top:2px}
.tooltip{position:fixed;pointer-events:none;background:#0b0b0b;color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;max-width:340px;display:none;z-index:9}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}nav{position:static;max-height:none}.tiles{grid-template-columns:repeat(2,1fr)}.two,.persona{grid-template-columns:1fr}.timeline{grid-template-columns:1fr 1fr}}
@media print{nav,header .hdr-r{display:none}section{display:block;page-break-after:always}.mat-wrap{max-height:none}}
</style>
</head>

</header>

</div>

 'New case manager, day one':[['HR / Ops request','Angel creates the user, copies the previous case manager: Standard User Basic + 4 PSGs + 20 sets + 9 program groups + 5 queues (Monica Beard, 2026-11-03).','Onboarding sheet names persona = Case Manager and programs = YcanthRx, Luminopia. Script assigns PRO_PSG_Case_Manager, PRO_PRG_YCANTH + PRG_YCANTH, PRO_PRG_LUMINOPIA + PRG_LUMINOPIA, role Case Manager.'],['First login','Can read every patient and diagnosis in the org, edit and delete any case, export any report, call the API from any laptop.','Sees patients and cases of YcanthRx and Luminopia. Cannot delete, cannot export, no API, device verification on.'],['New Case dialog','19 record types offered, including CorMedix program case and Free Goods.','11 record types offered: the Case Manager list, none of the other programs\' types.'],['Audit question: what can she do?','Nobody can answer without a script (36 artefacts, none with a description).','Five artefacts; each name says what it grants; perm-health.mjs prints the answer.']],

/* ===================== SECTIONS ===================== */
const sections={
 s1:()=>`<h2>1. The problem in numbers</h2><p class="lead">Production, read on 2026-11-05 by five parallel read-only investigations. Toggle <span class="kbd">TODAY</span> / <span class="kbd">TARGET</span> in the header (or press <span class="kbd">T</span>) to see where each number lands after the plan.</p>${tiles()}<div class="note ${T()?'red':'green'}">${T()?'Program isolation exists in names only. The only thing stopping a case manager from opening another program\'s patient today is politeness.':'Same people, same work, one job per mechanism. Every number above is produced by the weekly health check, not by hand.'}</div><div class="presenter">Say: four mechanisms that should be layered (profile, permission set, group membership, sharing rule) are all used for the same job, so every ticket was solved by adding one more. Nothing was ever removed. Source: master section 1.</div>`,
 s2:()=>`<h2>2. How access is granted ${T()?'today':'in the target model'}</h2><p class="lead">Think of the org as a building. The profile is the front-door badge. Permission sets are key rings. Public groups are the floor lists. Sharing rules are the signs on the doors. Queues are the in-trays. Roles say who reports to whom. ${T()?'Today every badge opens every room on every floor.':'In the target each one has exactly one job.'}</p>${layers()}<div class="note">Role-based, in plain words: the <b>persona</b> (Case Manager, Payor Specialist ...) lives in a function permission set bundled into a persona PSG, not in the Salesforce Role object. The Role object only carries who manages whom and queue membership by role.</div><div class="presenter">Hover each layer. Today: every layer does another layer's job. Switch to TARGET: same layers, one job each. Source: master 5.1, 5.2, 5.6.</div>`,
 s3:()=>`<h2>3. One new hire, ${T()?'36 key rings':'6 artefacts'}</h2><p class="lead">The clearest way to see the drift is to follow one real onboarding from the audit trail.</p>${monica()}<div class="presenter">Audit trail 2026-11-03: about 40 clicks by the admin who onboarded her, cloned from the previous case manager. New hires get 35 to 41 sets; 38 of 90 basic users hold the actual baseline set. Source: master section 3.</div>`,
 s4:()=>`<h2>4. Who can see what, live</h2><p class="lead">Pick a kind of user. Left column: what they can do in production today, from the per-user matrix, and what they will be able to do. For people, the live panel below lets you choose their programs and features and see the exact artefact stack, then test any record.</p>${personaView()}<div class="presenter">Demo move: pick Case Manager, untick Delcath, try "Patient on Delcath Hepzato, read". Today: allowed. Target: not visible. Tick Delcath: allowed. That is the whole model in one click. The Sales persona is TD-2218. Source: master 2.9, 5.7; users-master-matrix.csv.</div>`,
 s5:()=>`<h2>5. Case record types: who sees what${T()?' today':' in the target'}</h2><p class="lead">${T()?'Share of each persona who can see each of the 20 Case record types, from profile and permission sets. Every persona sees nearly everything; a Support Associate has the same footprint as a Case Manager.':'Work = create, edit, own. Read = see within own programs. Blank = not available. Record types move from the profile and program sets into the function and feature sets. Proposal for Rachel Johnson and Nicki White to confirm.'}</p>${matrix()}<div class="note ${T()?'red':''}">${T()?'CarePlan, Free Goods and the CorMedix case are on the profile for all 90 users. New_Case_RT_Admin_Access (77 users) opens almost every type. 85 HCP Portal Request cases are visible to no case manager, payor specialist or support associate.':'Program-only types (CorMedix case, Fennec Treatment Cycle, MyCellAssist Financial Assistance) sit in PRO_PRG_<KEY>. Copay types are a feature. Portal types are created by the integration identity and triaged by Support Associates. CareGap (0 records) is retired.'}</div><div class="presenter">Source: docs/security/pro-access-model/2026-11-06-case-record-type-by-persona.md; data/case-rt-by-persona-today.csv.</div>`,
 s6:()=>`<h2>6. Master keys and dead signs${T()?'':': after wave 3'}</h2><p class="lead">${T()?'Left: the permission sets that let ordinary users see and edit every patient or case. Right: how many records the sharing rules actually reach.':'Left: the only places View All / Modify All survive, each with its reason; every legacy bar drops to zero. Right: every keyed record is reached by a generated rule.'}</p><div class="two"><div class="card"><h3>${T()?'Permission sets that grant View All + Modify All on patients or cases (active holders)':'Who keeps a master key, and the legacy sets at zero'}</h3>${masterKeysView()}${T()?'<p style="color:var(--ink2);font-size:13px">Target: none of these outside the 8 administrators and the named integration sets.</p>':''}</div><div class="card"><h3>${T()?'Do the sharing rules actually reach the records? (rule shares / records)':'Generated exact-key rules: records reached'}</h3>${coverageView()}<p style="color:var(--ink2);font-size:13px">${T()?'Cases: the rules match a free-text field that is empty on 31,677 of 36,788 cases. Nobody noticed because the master keys open everything anyway.':'The key is stamped by the before-save flow of each object and backfilled once; the 19 patients and 232 cases without a program are a data-quality list for Ops, not a sharing gap.'}</p></div></div><div class="presenter">Two charts, one message: today the sharing layer is dead and the permission layer papers over it; in the target the permission layer carries no record access at all and the sharing layer reaches 100% of keyed records. Source: REPORT-PERMSETS 4.1, REPORT-SHARING 6; master 5.6.</div>`,
 s7:()=>`<h2>7. Program by program${T()?'':': the kit every program gets'}</h2><p class="lead">${T()?'Each client program should have a group, a dedicated set, and a sharing rule on each patient-facing object. Red cells are the gaps. Only Fennec Hears and CorMedix are complete, and both leak through "contains" matching.':'Every keyed program gets the same four things, generated from its key: a group (the Ops list of who works it), a set (its record types and fields, no object powers), its queues, and one exact-key sharing rule per patient-facing object.'}</p>${programTable()}<div class="presenter">${T()?'Point at Mead Johnson (largest program, no case rule, no set), Moximed (group with zero active members), the duplicate Ycanth program (16 patients already). Then press T.':'Say: the table is uniform because a script produced it; onboarding a program becomes one afternoon and is identical every time. Membership of PRG_KEY is the only thing a human maintains.'} Source: master 2.4 and 5.6, sharing-program-matrix.csv.</div>`,
 s8:()=>`<h2>8. ${T()?'What we found: 58 defects, ranked':'The 58 defects: when each one closes'}</h2><p class="lead">${T()?'Blocker = a door open today. Major = a wrong control that will bite within weeks or stops the target. Minor = housekeeping. Every row names the wave that fixes it; evidence files are in the master document section 4.':'Same 58 findings grouped by the wave that closes them. Filter by wave to show what a given Wednesday delivers.'}</p>${bugTable()}<div class="presenter">${T()?'Do not read the list. Filter to Blocker (12 rows) and read R-01, R-03, R-05, R-07. Then press T to show when they close.':'Wave 0 closes 15 findings this week with no design dependency, including 4 blockers. Waves 1 to 3 close the rest; wave 4 is the check that keeps them closed.'}</div>`,
 s9:()=>`<h2>9. ${T()?'The model today: what the layers actually do':'The target model'}</h2><p class="lead">${T()?'The same eight layers as the target, as they stand in production. Every layer is doing part of another layer\'s job.':'Five rules. Profile = front door only. Permission sets = what you may do, in six named layers. Program group = whose records you see. Sharing rules = generated from one program key, exact match, never hand-written. Queues by group or role. Everyone has a manager.'}</p><div class="diagram">${T()?todayDiagram():`LOGIN      Profile "PRO Internal User"                                   apps, tabs, login policy only
BASELINE   PSG Health_Cloud_Base_Access + PS PRO_BASE_Internal_User         Account/Contact/Case/Task CRE, ~330 shared fields, common RTs
FUNCTION   exactly one PRO_FN_*  (bundled per persona in PRO_PSG_*)         Case_Manager | Payor_Specialist | Support_Associate | Program_Leader | Field_Reimbursement | Business_Development | Executive | Reporting_Analyst
PROGRAM    0..n PRO_PRG_&lt;KEY&gt;  paired with  group PRG_&lt;KEY&gt;                 RTs + program fields  /  record access via generated rules (script keeps the two lists identical)
FEATURE    0..n PRO_FEAT_*                                                 Copay, Clinical_Encounter(+Delete), Letters, Fax_Blast, Consent_Admin, PAP approvers, RTIP, Case_Delete, Export, Program_Config_Editor ...
QUEUES     Q_&lt;KEY&gt;_&lt;Purpose&gt; per program process + 7 function queues        membership by PRG group or role, never by user list
ELEVATED   group PRG_ALL (QA / cross-program leads)  +  role tree           replaces View All for management
ADMIN      System Administrator (8 humans) + PRO_ADM_*                      Login_As, Audit_Fields, Data_Steward, Your_Account, Encryption, Sandbox, DevOps
SYSTEM     svc.* identities, API-only profiles, one PRO_INT_&lt;System&gt; each    Heroku v3, MuleSoft, Sentinel, Azure files, Fivetran, pipeline; PRG_INTEGRATION group`}</div>
 <div class="two"><div class="card"><h3>Artefacts per person, by persona (median today vs target)</h3><div class="legend"><span style="background:var(--today)"></span>today <span style="background:var(--target)"></span>target, for the programs selected in section 4 (${S.programs.length})</div>${artefactBars()}</div><div class="card">${T()?driftList():`<h3>What keeps it honest</h3><ul><li>Naming standard a script can check (PRO_BASE / FN / PRG / FEAT / ADM / INT, PRG_&lt;KEY&gt;, Q_&lt;KEY&gt;_&lt;Purpose&gt;)</li><li>Weekly health check: any View All / Modify All / Delete outside PRO_ADM and PRO_INT fails the build; set = group; no grants on inactive users</li><li>Every new field states its FLS home at build time; the deploy is not done until the diff is empty</li><li>Permission-set files never deployed over an existing set; row updates per org with before/after counts</li><li>Program onboarding = one generator run; user onboarding = one YAML</li></ul><h3>What leaves</h3><p style="font-size:13.5px;color:var(--ink2)">About 75 legacy sets: New_Case_RT_Admin_Access, the supervisor set, 10 program sets, 16 Fennec components and their group, 5 shared-inbox shells, the clinical encounter family, Edit_Tasks, the empty delete set, Export set, RTIP pair, 11 zero-holder sets, 7 app shells. About 60 custom sets remain (1 baseline, 8 function, 17 program, 20 feature, 8 admin, 6 integration) plus the managed licence sets.</p>`}</div></div><div class="presenter">${T()?'Press T here: the same eight rows become the target. Source: master sections 2 and 5.':'Source: master sections 5 and 6. The catalogue table in 5.4 maps every legacy set to its new home; the decision table in 5.7 is per persona per object.'}</div>`,
 s10:()=>`<h2>10. How a working day changes</h2><p class="lead">Six everyday journeys, each as today versus target. The same people do the same work; what changes is what the system lets through and how long the admin task takes.</p>${journeyView()}<div class="presenter">Pick "Case manager opens another program's patient" for the visibility story, "Offboarding" for the hygiene story, "New program onboarding" for the speed story.</div>`,
 s11:()=>`<h2>11. Five waves to get there</h2><p class="lead">Nothing is removed from a human until wave 3, and only after a regression script proves nobody loses a record they worked in the last 30 days. Click a wave.</p>${waveView()}<div class="presenter">Wave 0 can start this week and needs only Ali's confirmation per deletion list. Waves 1 and 2 are additive. Wave 3 is two Wednesday windows a week apart. Source: master section 7.</div>`,
 s12:()=>`<h2>12. Decisions and the ask</h2><p class="lead">Twelve decisions that only the business, compliance or Ms. Nicole Cross can take, each with an owner, a date and a recommendation. The ask: approve wave 0 now, decisions 1 and 2 before wave 1, the record-type matrix (11, 12) before wave 2, and three Wednesday windows.</p>${decisionTable()}<div class="foot">Everything in this demo comes from docs/security/pro-access-model (master 2026-11-05, case record-type analysis 2026-11-06) and the data files next to them; same content on Confluence TD: Org Architecture by Spikes, Stories and Design Solution. No patient data; staff names only. Built 2026-11-06, merged from the slide deck and the live dashboard.</div><div class="presenter">Close with: this is reversible at every step, it removes nothing until we have proof, and after it the question "who can see patient X" has a one-line answer.</div>`
};

/* ===================== RENDER + EVENTS ===================== */
function curId(){const h=(location.hash||'#s1').slice(1);return sections[h]?h:'s1';}
function render(){const cur=curId();document.documentElement.style.setProperty('--modecol',col());
 document.querySelectorAll('#modeSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
 document.getElementById('nav').innerHTML=['Today','Target'].map(g=>`<div class="t">${g.toUpperCase()}</div>`+steps.filter(s=>s.g===g).map(s=>`<a href="#${s.id}" class="${s.id===cur?'active':''}"><span class="n">${s.n}</span>${s.t}</a>`).join('')).join('')+`<div class="hint">Keys: ← → sections · T today/target · N notes<br>Selections persist across refresh; Reset clears.</div>`;
 document.getElementById('main').innerHTML=`<section class="active">${sections[cur]()}</section>`;}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
document.getElementById('modeSwitch').addEventListener('click',e=>{if(e.target.dataset.m)set('mode',e.target.dataset.m);});
document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('[data-persona]');if(b){set('persona',b.dataset.persona);return;}
 const w=e.target.closest('[data-wave]');if(w){set('wave',+w.dataset.wave);return;}const f=e.target.closest('[data-bug]');if(f){set('bugFilter',f.dataset.bug);}});
document.getElementById('main').addEventListener('change',e=>{const t=e.target;
 if(t.dataset.prog){const s=new Set(S.programs);t.checked?s.add(t.dataset.prog):s.delete(t.dataset.prog);S.programs=D.programs.map(p=>p[0]).filter(k=>s.has(k));save();render();return;}
 if(t.dataset.feat){set(t.dataset.feat,t.checked);return;}
 if(t.dataset.try){set(t.dataset.try,t.value);return;}
 if(t.hasAttribute('data-journey')){set('journey',t.value);}});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const i=steps.findIndex(s=>s.id===curId());
 if(e.key==='ArrowRight'&&i<steps.length-1)location.hash=steps[i+1].id;if(e.key==='ArrowLeft'&&i>0)location.hash=steps[i-1].id;
 if(e.key==='t'||e.key==='T')set('mode',T()?'target':'today');if(e.key==='n'||e.key==='N')document.body.classList.toggle('notes');});
const tip=document.getElementById('tip');document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return;}tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(window.innerWidth-360,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px';});
render();
</script>
</body>
